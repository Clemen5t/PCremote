name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          rm -rf build Payload PCRemote-unsigned.ipa
          xcodebuild \
            -project PCRemote.xcodeproj \
            -target PCRemote \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Create unsigned IPA
        run: |
          test -d build/PCRemote.app
          mkdir -p Payload
          cp -R build/PCRemote.app Payload/
          zip -qry PCRemote-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-unsigned-ipa
          path: PCRemote-unsigned.ipa
